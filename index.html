<style type="text/css">
*, *:after, *:before {
  box-sizing: border-box;
  -moz-box-sizing: border-box;
}
* {margin:0;padding:0;border: 0 none;position: relative;}
 
html {
  background: url(image/bg2.jpg) 0 0 no-repeat ;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: cover;
  background-color: #464646;
}
body {
  width: 100%;
  min-height: 100%;
  background: inherit;
  overflow: hidden;
}

article {
  background: inherit;
  position: relative;
  width: 300px;
  margin: 10vh auto 15vh;
  border-radius: 15px;
  border: 10px solid rgba(255,255,255,.15);
  box-shadow: 1px 1px 4px rgba(0,0,0,.3);
  z-index: 5;
  font-size: 1.5rem;
}
article:before {
  content: '';
  position: absolute;
  top: 0; left:0; right:0; bottom:0;
  background: inherit;
  filter: blur(5px);
  -webkit-filter: blur(6px);
  -moz-filter: blur(6px);
  -o-filter: blur(6px);
  -ms-filter: blur(6px);
  filter: url(#blur);filter:progid:DXImageTransform.Microsoft.Blur(PixelRadius='6');
}
 
svg {
  height:0;
  width: 0;
  position: absolute;
}

body::before{
  content: '';
  display:block;
  padding-top:10%;
}

input[type=radio]:focus {
  box-shadow: 0 0 30px royalblue;
  border-radius:20px;
}
input[type=radio]:focus:checked{
  box-shadow:none;
}

input[type=radio] {
  border: 0px;
}

.slogan{
  font-size: 13px;
  color: rgba(0,0,0, .3);
}

input[type="radio"]{
  margin-right:3px;
  margin-left: 0px;
  position: relative;
}

function playChannel(index) {
  var channel = channels[index];
  var player = document.getElementById("music");

  if (!channel || !player) return;

  player.src = channel.url;
  player.load();

  var playback = player.play();
  if (playback && typeof playback.catch === "function") {
    playback.catch(function (error) {
      console.warn("Playback failed:", channel.name, error);
    });
  }
}

function renderChannelButtons() {
  var container = document.getElementById("channelButtons");
  if (!container) return;

  channels.forEach(function (channel, index) {
    var input = document.createElement("input");
    input.name = "checkit";
    input.type = "radio";
    input.className = "radiobox-tremolo";
    input.title = (index + 1) + ". " + channel.name;
    input.setAttribute("aria-label", "Channel " + (index + 1) + ": " + channel.name);
    input.addEventListener("click", function () {
      playChannel(index);
    });
    container.appendChild(input);

    if ((index + 1) % 10 === 0) {
      container.appendChild(document.createElement("br"));
    }
  });
}

renderChannelButtons();
