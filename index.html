<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ラジオボタン</title>

<style type="text/css">
:root {
  --page: #eef1f6;
  --paper: #f7f9fc;
  --paper-bright: #ffffff;
  --ink: #232b3a;
  --muted: #77859a;
  --shadow: #c7d0dd;
  --highlight: #ffffff;
  --accent: #d88b3d;
  --accent-hot: #ffb35f;
  --ok: #2eb872;
  --checking: #e4b83f;
  --dead: #ff5364;
  --unknown: #9aa6b6;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--page);
}

body {
  min-height: 100vh;
  margin: 0;
  padding: clamp(16px, 4vw, 42px) 16px 136px;
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:
    radial-gradient(circle at 30% 0%, rgba(255,255,255,.96), rgba(255,255,255,0) 35%),
    linear-gradient(145deg, #fbfcff 0%, #e9eef5 58%, #f9fbfd 100%);
  overflow-x: hidden;
}

button {
  font: inherit;
}

.app-shell {
  width: min(1120px, 100%);
  margin: 0 auto;
}

.radio-panel {
  position: relative;
  width: 100%;
  min-height: calc(100vh - 196px);
  padding: clamp(18px, 4vw, 34px);
  border: 1px solid rgba(255,255,255,.74);
  border-radius: 8px;
  background:
    radial-gradient(circle at 28% 8%, rgba(255,255,255,.88), rgba(255,255,255,0) 30%),
    linear-gradient(145deg, #f8fafc, #e7edf5);
  box-shadow:
    32px 32px 70px rgba(186,196,211,.82),
    -26px -26px 58px rgba(255,255,255,.98),
    inset 1px 1px 0 rgba(255,255,255,.98),
    inset -1px -1px 0 rgba(191,201,216,.18);
}

.health-summary {
  position: absolute;
  top: 16px;
  right: 18px;
  width: fit-content;
  min-width: 94px;
  margin: 0;
  padding: 8px 10px;
  border-radius: 8px;
  color: rgba(77,91,112,.66);
  font-size: .7rem;
  font-weight: 800;
  text-align: right;
  background: linear-gradient(145deg, rgba(231,237,245,.7), rgba(251,252,255,.78));
  box-shadow:
    5px 5px 13px rgba(196,205,218,.42),
    -5px -5px 13px rgba(255,255,255,.72),
    inset 1px 1px 0 rgba(255,255,255,.74);
  letter-spacing: .02em;
}

.now-playing {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 12px;
  margin-bottom: 26px;
  padding: 13px 16px;
  border-radius: 8px;
  background: linear-gradient(145deg, #e6ecf4, #fbfcff);
  box-shadow:
    inset 9px 9px 18px rgba(194,203,216,.72),
    inset -9px -9px 18px rgba(255,255,255,.94);
}

.now-label {
  min-width: 46px;
  color: #748297;
  font-size: .72rem;
  font-weight: 900;
}

#currentChannel {
  min-width: 0;
  overflow: hidden;
  color: #263247;
  font-size: clamp(.96rem, 2.2vw, 1.08rem);
  font-weight: 800;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.channel-grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(54px, 1fr));
  gap: clamp(10px, 1.7vw, 18px);
  padding: clamp(14px, 3vw, 26px);
  border-radius: 8px;
  background: linear-gradient(145deg, #e7edf5, #f8fbff);
  box-shadow:
    inset 14px 14px 30px rgba(190,199,213,.74),
    inset -14px -14px 30px rgba(255,255,255,.98);
}

.channel-switch {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
  aspect-ratio: 1 / .72;
  width: 100%;
  padding: 8px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 8px;
  color: #2d3748;
  cursor: pointer;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.9), rgba(255,255,255,0) 36%),
    linear-gradient(145deg, #fbfdff, #e2e9f2);
  box-shadow:
    12px 12px 24px rgba(188,198,212,.78),
    -11px -11px 22px rgba(255,255,255,.98),
    inset 1px 1px 0 rgba(255,255,255,.98);
  transition:
    transform .42s cubic-bezier(.18, .95, .2, 1),
    box-shadow .42s cubic-bezier(.18, .95, .2, 1),
    border-color .24s ease,
    background .24s ease;
}

.channel-switch:hover {
  transform: translateY(-1px);
}

.channel-switch:active {
  transform: translateY(1px) scale(.99);
  box-shadow:
    inset 8px 8px 16px rgba(188,198,212,.82),
    inset -8px -8px 16px rgba(255,255,255,.96);
}

.channel-switch:focus-visible {
  outline: 3px solid rgba(255,138,36,.42);
  outline-offset: 4px;
}

.toggle-track {
  position: relative;
  width: min(82px, 100%);
  height: clamp(30px, 4.2vw, 42px);
  padding: 3px;
  overflow: hidden;
  border-radius: 999px;
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.12), rgba(255,255,255,0) 30%),
    linear-gradient(145deg, #303844, #070b12 72%);
  box-shadow:
    inset 8px 8px 13px rgba(0,0,0,.52),
    inset -5px -5px 10px rgba(255,255,255,.13),
    0 8px 14px rgba(52,62,77,.16);
}

.toggle-fill {
  position: absolute;
  inset: 5px auto 5px 8px;
  width: 40%;
  border-radius: 999px;
  opacity: 0;
  background:
    radial-gradient(circle at 68% 50%, rgba(255,214,154,.95), rgba(255,214,154,0) 38%),
    linear-gradient(90deg, rgba(216,139,61,.98), rgba(255,179,95,.18));
  filter: blur(.2px);
  transition: opacity .34s ease, transform .42s cubic-bezier(.18, .95, .22, 1);
}

.toggle-thumb {
  position: absolute;
  top: 4px;
  left: 4px;
  width: calc(50% - 6px);
  height: calc(100% - 8px);
  border-radius: 50%;
  background:
    radial-gradient(circle at 66% 33%, rgba(255,255,255,.96) 0 12%, rgba(255,255,255,0) 28%),
    linear-gradient(145deg, #ffffff 0%, #eef2f6 38%, #b9c2ce 100%);
  box-shadow:
    8px 8px 14px rgba(0,0,0,.38),
    -4px -4px 9px rgba(255,255,255,.34),
    inset 1px 1px 2px rgba(255,255,255,.92),
    inset -2px -2px 4px rgba(134,145,160,.24);
  transition:
    transform .46s cubic-bezier(.18, .95, .22, 1),
    box-shadow .34s ease,
    background .34s ease;
}

.channel-switch.is-active {
  border-color: rgba(255,138,36,.36);
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.92), rgba(255,255,255,0) 38%),
    linear-gradient(145deg, #ffffff, #e9eef6);
  box-shadow:
    13px 13px 26px rgba(188,198,212,.78),
    -11px -11px 24px rgba(255,255,255,.98),
    0 0 0 5px rgba(216,139,61,.12);
}

.channel-switch.is-active .toggle-fill {
  opacity: 1;
  transform: translateX(26%);
}

.channel-switch.is-active .toggle-thumb {
  transform: translateX(calc(100% + 4px));
  box-shadow:
    -8px 8px 16px rgba(0,0,0,.34),
    3px -3px 10px rgba(255,255,255,.22),
    inset 1px 1px 2px rgba(255,255,255,.9),
    inset -2px -2px 4px rgba(134,145,160,.22);
}

.channel-switch.stream-dead {
  border-color: rgba(255,83,100,.46);
  box-shadow:
    8px 8px 17px rgba(197,205,218,.74),
    -8px -8px 17px rgba(255,255,255,.9),
    0 0 0 4px rgba(255,83,100,.12);
}

.visualizer-panel {
  position: fixed;
  right: 16px;
  bottom: 14px;
  left: 16px;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(78px, 118px) 1fr;
  align-items: center;
  gap: 14px;
  width: min(1120px, calc(100% - 32px));
  height: 104px;
  margin: 0 auto;
  padding: 14px;
  border: 1px solid rgba(255,255,255,.78);
  border-radius: 8px;
  background:
    radial-gradient(circle at 24% 0%, rgba(255,255,255,.82), rgba(255,255,255,0) 38%),
    linear-gradient(145deg, rgba(250,252,255,.96), rgba(226,233,243,.96));
  box-shadow:
    17px 17px 38px rgba(190,199,213,.88),
    -14px -14px 32px rgba(255,255,255,.96),
    inset 1px 1px 0 rgba(255,255,255,.94);
  backdrop-filter: blur(12px);
}

.visualizer-meta {
  display: grid;
  gap: 5px;
  color: #5c6a7d;
  font-size: .74rem;
  font-weight: 900;
}

.visualizer-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--unknown);
  box-shadow:
    3px 3px 7px rgba(191,200,214,.9),
    -3px -3px 7px rgba(255,255,255,.94);
}

.visualizer-dot.is-playing {
  background: var(--accent);
  box-shadow:
    0 0 18px rgba(216,139,61,.72),
    3px 3px 7px rgba(191,200,214,.72),
    -3px -3px 7px rgba(255,255,255,.9);
}

#visualizerCanvas {
  display: block;
  width: 100%;
  height: 70px;
  border-radius: 8px;
  background: linear-gradient(145deg, #e4ebf4, #fbfcff);
  box-shadow:
    inset 8px 8px 16px rgba(199,207,220,.86),
    inset -8px -8px 16px rgba(255,255,255,.95);
}

#music {
  display: none;
}

@media (max-width: 720px) {
  body {
    padding-right: 12px;
    padding-left: 12px;
  }

  .health-summary {
    top: 12px;
    right: 12px;
  }

  .channel-grid {
    grid-template-columns: repeat(5, minmax(44px, 1fr));
    gap: 12px;
  }

  .visualizer-panel {
    right: 10px;
    bottom: 10px;
    left: 10px;
    grid-template-columns: 1fr;
    gap: 8px;
    width: calc(100% - 20px);
    height: 120px;
  }

  .visualizer-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
}
</style>
</head>

var channelButtons = [];
var activeChannelIndex = null;

function updateHealthSummary() {
  var counts = channelButtons.reduce(function (result, button) {
    var state = button.dataset.streamState || "pending";
    result[state] = (result[state] || 0) + 1;
    return result;
  }, {});
  var summary = document.getElementById("healthSummary");

  if (!summary) return;
  summary.textContent = "OK " + (counts.ok || 0) + " / NG " + (counts.dead || 0);
}

function setChannelState(index, state, detail) {
  var button = channelButtons[index];
  var label = "Channel " + String(index + 1).padStart(2, "0");

  if (!button) return;

  button.classList.remove("stream-checking", "stream-ok", "stream-dead", "stream-unknown");
  button.dataset.streamState = state;

  if (state) {
    button.classList.add("stream-" + state);
  }

  if (state === "ok") {
    button.title = label + " - OK";
  } else if (state === "dead") {
    button.title = label + " - Not reachable" + (detail ? " (" + detail + ")" : "");
  } else if (state === "unknown") {
    button.title = label + " - Check unavailable" + (detail ? " (" + detail + ")" : "");
  } else if (state === "checking") {
    button.title = label + " - Checking";
  } else {
    button.title = label;
  }

  updateHealthSummary();
}

function setActiveChannel(index) {
  activeChannelIndex = index;
  channelButtons.forEach(function (button, buttonIndex) {
    var active = buttonIndex === index;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-pressed", active ? "true" : "false");
  });
}

function updatePlaybackStatus(status) {
  var state = document.getElementById("visualizerState");
  var dot = document.getElementById("visualizerDot");

  if (state) {
    state.textContent = status;
  }

  if (dot) {
    dot.classList.toggle("is-playing", status === "PLAYING");
  }
}

function playChannel(index) {
  var channel = channels[index];
  var player = document.getElementById("music");
  var current = document.getElementById("currentChannel");

  if (!channel || !player) return;

  setActiveChannel(index);

  if (current) {
    current.textContent = channel.name || "CHANNEL " + String(index + 1).padStart(2, "0");
  }

  player.src = channel.url;
  player.load();
  updatePlaybackStatus("LOADING");

  var playback = player.play();
  if (playback && typeof playback.catch === "function") {
    playback.catch(function (error) {
      console.warn("Playback failed:", channel.name, error);
      updatePlaybackStatus("ERROR");
      setChannelState(index, "dead", "playback failed");
    });
  }
}

function renderChannelButtons() {
  var container = document.getElementById("channelButtons");
  if (!container) return;

  channels.forEach(function (channel, index) {
    var button = document.createElement("button");
    var track = document.createElement("span");
    var fill = document.createElement("span");
    var thumb = document.createElement("span");

    button.type = "button";
    button.className = "channel-switch";
    button.title = "Channel " + String(index + 1).padStart(2, "0");
    button.setAttribute("aria-label", "Channel " + String(index + 1).padStart(2, "0"));
    button.setAttribute("aria-pressed", "false");

    track.className = "toggle-track";
    fill.className = "toggle-fill";
    thumb.className = "toggle-thumb";

    track.appendChild(fill);
    track.appendChild(thumb);
    button.appendChild(track);
    button.addEventListener("click", function () {
      playChannel(index);
    });
    container.appendChild(button);
    channelButtons[index] = button;
  });

  updateHealthSummary();
}

function checkChannel(index) {
  return new Promise(function (resolve) {
    var channel = channels[index];
    var probe = document.createElement("audio");
    var finished = false;
    var timer = null;
    var interval = null;

    function cleanup() {
      clearTimeout(timer);
      clearInterval(interval);
      probe.pause();
      probe.removeAttribute("src");
      probe.load();
      if (probe.parentNode) {
        probe.parentNode.removeChild(probe);
      }
    }

    function finish(state, detail) {
      if (finished) return;
      finished = true;
      cleanup();
      setChannelState(index, state, detail);
      resolve({ index: index, state: state, detail: detail });
    }

    setChannelState(index, "checking");

    probe.muted = true;
    probe.preload = "none";
    probe.src = channel.url;
    probe.style.display = "none";
    document.body.appendChild(probe);

    probe.addEventListener("error", function () {
      finish("dead", "media error");
    });

    var playback = probe.play();
    if (playback && typeof playback.catch === "function") {
      playback.catch(function (error) {
        if (finished) return;

        if (error && error.name === "NotAllowedError") {
          finish("unknown", "autoplay blocked");
        }
      });
    }

    interval = setInterval(function () {
      if (probe.error) {
        finish("dead", "media error");
      } else if (!probe.paused && probe.readyState >= 3 && probe.currentTime > 0.2) {
        finish("ok");
      }
    }, 200);

    timer = setTimeout(function () {
      finish("dead", "timeout");
    }, 6500);
  });
}

function checkAllChannels() {
  var nextIndex = 0;
  var active = 0;
  var maxActive = 8;

  function runNext() {
    while (active < maxActive && nextIndex < channels.length) {
      active += 1;
      checkChannel(nextIndex).then(function () {
        active -= 1;
        runNext();
      });
      nextIndex += 1;
    }
  }

  runNext();
}

function resizeCanvas(canvas, context) {
  var ratio = window.devicePixelRatio || 1;
  var width = Math.max(1, Math.floor(canvas.clientWidth * ratio));
  var height = Math.max(1, Math.floor(canvas.clientHeight * ratio));

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }

  context.setTransform(ratio, 0, 0, ratio, 0, 0);
}

function drawBar(context, x, y, width, height, radius) {
  if (context.roundRect) {
    context.beginPath();
    context.roundRect(x, y, width, height, radius);
    context.fill();
    return;
  }

  context.fillRect(x, y, width, height);
}

function drawVisualizer() {
  var canvas = document.getElementById("visualizerCanvas");
  var context = canvas && canvas.getContext("2d");
  var width;
  var height;
  var now = Date.now();
  var seconds = now / 1000;
  var time = new Date(now);
  var timeText = time.toLocaleTimeString("ja-JP", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
  var fill;
  var surface;
  var wave;
  var i;

  if (!canvas || !context) {
    requestAnimationFrame(drawVisualizer);
    return;
  }

  resizeCanvas(canvas, context);
  width = canvas.clientWidth;
  height = canvas.clientHeight;
  context.clearRect(0, 0, width, height);

  context.save();
  if (context.roundRect) {
    context.beginPath();
    context.roundRect(0, 0, width, height, 8);
    context.clip();
  }

  surface = height * .32 + Math.sin(seconds * .8) * 2;
  fill = context.createLinearGradient(0, surface, 0, height);
  fill.addColorStop(0, "rgba(255,204,126,.96)");
  fill.addColorStop(.42, "rgba(245,151,55,.92)");
  fill.addColorStop(1, "rgba(205,91,28,.9)");

  context.beginPath();
  context.moveTo(0, height);
  context.lineTo(0, surface);
  for (i = 0; i <= width + 8; i += 8) {
    wave = Math.sin(i * .024 + seconds * 1.8) * 4
      + Math.sin(i * .052 - seconds * 1.15) * 2;
    context.lineTo(i, surface + wave);
  }
  context.lineTo(width, height);
  context.closePath();
  context.fillStyle = fill;
  context.fill();

  context.beginPath();
  for (i = 0; i <= width + 8; i += 8) {
    wave = Math.sin(i * .024 + seconds * 1.8) * 4
      + Math.sin(i * .052 - seconds * 1.15) * 2;
    if (i === 0) {
      context.moveTo(i, surface + wave);
    } else {
      context.lineTo(i, surface + wave);
    }
  }
  context.strokeStyle = "rgba(255,241,204,.86)";
  context.lineWidth = 2;
  context.stroke();

  context.font = "900 " + Math.max(24, Math.min(42, height * .48)) + "px Segoe UI, system-ui, sans-serif";
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.shadowColor = "rgba(112,47,11,.38)";
  context.shadowBlur = 10;
  context.fillStyle = "rgba(255,248,235,.96)";
  context.fillText(timeText, width / 2, surface + (height - surface) * .55);
  context.restore();

  requestAnimationFrame(drawVisualizer);
}

function bindPlayerEvents() {
  var player = document.getElementById("music");

  if (!player) return;

  player.addEventListener("playing", function () {
    updatePlaybackStatus("PLAYING");
  });
  player.addEventListener("pause", function () {
    updatePlaybackStatus("PAUSED");
  });
  player.addEventListener("waiting", function () {
    updatePlaybackStatus("LOADING");
  });
  player.addEventListener("error", function () {
    updatePlaybackStatus("ERROR");
    if (activeChannelIndex !== null) {
      setChannelState(activeChannelIndex, "dead", "playback failed");
    }
  });
}

renderChannelButtons();
bindPlayerEvents();
drawVisualizer();

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", checkAllChannels);
} else {
  checkAllChannels();
}
</script>
