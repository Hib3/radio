<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ワンクリックでインターネットラジオが流れる50chコントロールデッキ">
<title>RADIO BUTTON — ラヂオボタン</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- ?v= はモバイルSafariの強いキャッシュ対策。更新時に数字を上げる -->
<link rel="stylesheet" href="css/style.css?v=4">
</head>

<body>
<div class="deck-bg" aria-hidden="true"></div>

<main class="app-shell">
  <header class="deck-header panel">
    <div class="brand">
      <h1>RADIO<span>BUTTON</span></h1>
      <p class="tagline">ラヂオボタン // 50CH INTERNET RADIO CONSOLE // R4</p>
    </div>
    <div class="clock-widget" aria-label="現在時刻">
      <div class="clock-time" id="clockTime">--:--:--</div>
      <div class="clock-sub">
        <span id="clockDate">----------</span>
        <span class="clock-zone">LOCAL</span>
      </div>
    </div>
  </header>

  <section class="now-panel panel" aria-label="再生中の放送局">
    <div class="now-playing">
      <span class="signal-led" id="signalLed"></span>
      <span class="now-ch" id="nowChannel">CH --</span>
      <span class="now-name" id="nowName">STANDBY — チャンネルを選択してください</span>
      <span class="now-genre" id="nowGenre"></span>
      <span class="now-status" id="nowStatus">IDLE</span>
    </div>
  </section>

  <section class="grid-panel panel" aria-label="チャンネル一覧">
    <div class="grid-head">
      <h2>CHANNEL MATRIX</h2>
      <div class="health" id="healthSummary">LINK <b class="ok">OK --</b> / <b class="ng">NG --</b></div>
      <button type="button" class="console-btn" id="scanButton">⟳ SCAN</button>
    </div>
    <div class="channel-grid" id="channelGrid"></div>
  </section>
</main>

<footer class="console panel" aria-label="コンソール">
  <canvas id="signalCanvas"></canvas>
  <div class="console-controls">
    <button type="button" class="console-btn" id="stopButton">■ STOP</button>
    <button type="button" class="console-btn" id="shuffleButton">⤨ SHUFFLE</button>
    <label class="volume">
      <span>VOL</span>
      <input type="range" id="volumeSlider" min="0" max="100" step="1" value="80" aria-label="音量">
      <span id="volumeValue">80</span>
    </label>
  </div>
</footer>

<!-- スイッチ画像の共有グラデーション定義 (各ボタンの <use> 先) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="swBezelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5870"/>
      <stop offset="0.45" stop-color="#1b2434"/>
      <stop offset="1" stop-color="#0c111d"/>
    </linearGradient>
    <linearGradient id="swWellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="swTrailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb35f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4ff2ff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="swThumbGrad" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#eef4fd"/>
      <stop offset="0.55" stop-color="#96a8c4"/>
      <stop offset="1" stop-color="#55637d"/>
    </radialGradient>
    <radialGradient id="swThumbLitGrad" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.55" stop-color="#4ff2ff"/>
      <stop offset="1" stop-color="#0e7f92"/>
    </radialGradient>
  </defs>
</svg>

<!-- チャンネルボタンの雛形。js/app.js が局の数だけ複製する。
     <use> だと内部パーツにクラスセレクタが届かないため、アートを直接展開している -->
<template id="switchTemplate">
  <button type="button" class="channel-switch" aria-pressed="false">
    <svg class="switch-art" viewBox="0 0 120 76" aria-hidden="true" focusable="false">
      <rect class="sw-bezel" x="2" y="2" width="116" height="72" rx="14"/>
      <rect class="sw-well" x="7" y="7" width="106" height="62" rx="10"/>
      <rect class="sw-track" x="14" y="22" width="92" height="32" rx="16"/>
      <rect class="sw-trail" x="18" y="27" width="72" height="22" rx="11"/>
      <g class="sw-thumb">
        <circle class="sw-ring" cx="30" cy="38" r="17"/>
        <circle class="sw-thumb-base" cx="30" cy="38" r="13"/>
        <circle class="sw-thumb-lit" cx="30" cy="38" r="13"/>
        <g transform="translate(22,30) scale(0.667)">
          <path class="sw-glyph" d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          <path class="sw-glyph" d="M12 2v10"/>
        </g>
      </g>
      <circle class="sw-led" cx="105" cy="14.5" r="3"/>
    </svg>
    <span class="switch-label"></span>
  </button>
</template>

<!-- 再生用 audio は2系統:
     playerCors  … crossorigin 付き。Web Audio 解析器につないで実スペクトラムを描く
     playerPlain … CORS 非対応局のフォールバック (解析なしで普通に鳴らす) -->
<audio id="playerCors" preload="none" crossorigin="anonymous"></audio>
<audio id="playerPlain" preload="none"></audio>

<script src="js/stations.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
